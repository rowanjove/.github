name: Reusable Tauri Windows Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      rust-version:
        required: false
        type: string
        default: 'stable'
      working-directory:
        required: false
        type: string
        default: '.'

jobs:
  build-windows:
    name: Build Tauri Windows App
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: hashFiles('**/pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          if (Test-Path pnpm-lock.yaml) { pnpm install --frozen-lockfile }
          elseif (Test-Path package-lock.json) { npm ci }
          elseif (Test-Path yarn.lock) { npx yarn install --frozen-lockfile }
          else { npm install }

      - name: Build Application
        shell: pwsh
        run: |
          if (Test-Path pnpm-lock.yaml) { pnpm tauri build --debug }
          else { npm run tauri build -- --debug }
